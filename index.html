<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة الوثائق الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;800&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        :root {
            --bg: #fdfdfe; --card: #ffffff; --primary: #4f46e5;
            --text: #0f172a; --sub: #64748b; --border: #f1f5f9;
            --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            color: var(--text); 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.6;
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            background: var(--card); 
            border: 1px solid var(--border); 
            padding: 28px; 
            border-radius: 28px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); 
            box-sizing: border-box;
        }
        
        h2 { 
            text-align: center; 
            color: var(--text); 
            margin-bottom: 25px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 0;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 10px 16px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }
        .btn-logout {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #camera-container { 
            width: 100%; 
            background: #000; 
            border-radius: 20px; 
            overflow: hidden; 
            margin-bottom: 20px; 
            position: relative; 
            display: none; 
            aspect-ratio: 3 / 4; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        #capture-btn { 
            position: absolute; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4); 
            color: white;
            padding: 12px 30px; 
            border-radius: 50px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s;
            z-index: 10;
        }

        .form-group { margin-bottom: 18px; }
        label { 
            font-size: 0.8rem; 
            font-weight: 600; 
            color: var(--sub); 
            display: block; 
            margin-bottom: 6px; 
            padding-right: 5px;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid var(--border); 
            background: #f8fafc;
            border-radius: 14px; 
            box-sizing: border-box; 
            outline: none; 
            font-family: inherit;
            font-size: 15px; 
            transition: 0.2s;
        }
        input:focus { 
            border-color: var(--primary); 
            background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        
        .btn-camera { 
            width: 100%; 
            padding: 14px; 
            background: #f5f3ff; 
            color: var(--primary); 
            border: 2px dashed #c4b5fd; 
            border-radius: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-add { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 16px;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .doc-item { 
            background: #ffffff; 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            margin-bottom: 20px; 
            overflow: hidden; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            margin-top: 20px;
        }
        .doc-img-preview { 
            width: 100%; 
            height: auto; 
            max-height: 380px; 
            object-fit: contain; 
            background: #fafafa;
        }
        .no-img-preview {
            width: 100%;
            height: 120px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
        }
        .doc-content { padding: 18px; display: flex; justify-content: space-between; align-items: flex-start; }
        
        .doc-info b { font-size: 1.1rem; color: var(--text); font-weight: 800; display: block; }
        .doc-info small { color: var(--sub); font-size: 0.85rem; display: flex; align-items: center; gap: 4px; margin-top: 2px; }

        .status-tag { 
            padding: 5px 12px; 
            border-radius: 10px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            display: inline-block; 
            margin-top: 10px;
            letter-spacing: 0.2px;
        }
        .badge-green { background: #ecfdf5; color: var(--success); }
        .badge-orange { background: #fffbeb; color: var(--warning); border: 1px solid #fef3c7; }
        .badge-red { background: #fef2f2; color: var(--danger); border: 1px solid #fee2e2; }
        
        .urgent-alert { animation: blinker 1s ease-in-out infinite alternate; }
        @keyframes blinker { from { opacity: 1; } to { opacity: 0.6; } }

        .btn-delete { 
            background: #fff; 
            border: 1px solid #fee2e2; 
            color: var(--danger); 
            width: 38px; 
            height: 38px; 
            border-radius: 12px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-delete:hover { background: var(--danger); color: white; border-color: var(--danger); }

        .toggle-auth-text {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--sub);
        }
        .toggle-auth-text span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 700;
        }
        .forgot-password-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--sub);
            text-decoration: none;
            cursor: pointer;
        }
        .forgot-password-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container" id="auth-section">
    <h2 id="auth-title">تسجيل الدخول</h2>
    
    <div class="form-group" id="email-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="authEmail" placeholder="name@example.com">
    </div>
    
    <div class="form-group" id="password-group">
        <label id="password-label">كلمة السر</label>
        <input type="password" id="authPassword" placeholder="••••••••">
    </div>

    <button class="btn-add" id="btn-auth-action" onclick="handleAuth()">دخول</button>
    
    <p class="toggle-auth-text" id="toggle-text">
        ليس لديك حساب؟ <span onclick="switchAuthMode('register')">أنشئ حساباً جديداً</span>
    </p>
    <a class="forgot-password-link" id="forgot-link" onclick="switchAuthMode('forgot')">نسيت كلمة المرور؟</a>
</div>

<div class="container" id="app-section" style="display: none;">
    <div class="user-bar">
        <div>مرحباً: <strong id="current-user-email"></strong></div>
        <button class="btn-logout" onclick="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            خروج
        </button>
    </div>

    <h2>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        محفظة تاريخ إنتهاء الصلاحية
    </h2>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <button id="capture-btn" onclick="takeSnapshot()">📸 التقاط الوثيقة</button>
    </div>

    <button class="btn-camera" id="start-cam" onclick="startCamera()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
        تصوير وثيقة جديدة (اختياري)
    </button>

    <div class="form-group">
        <label>اسم الوثيقة / الملاحظة</label>
        <input type="text" id="docName" placeholder="مثلاً: بطاقة التعريف الوطنية">
    </div>
    
    <div class="form-group">
        <label>تاريخ الانتهاء</label>
        <input type="date" id="docDate">
    </div>

    <button class="btn-add" onclick="saveDocument()">💾 حفظ في المحفظة</button>

    <div id="docList" class="doc-list"></div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('wallet_users')) || [];
    let allDocuments = JSON.parse(localStorage.getItem('hicham_docs_pro')) || [];
    
    let currentUser = localStorage.getItem('wallet_current_user') || null;
    let authMode = "login"; 
    let currentImgData = "";
    let resetEmailTarget = ""; 

    // تهيئة مكتبة EmailJS بالمفاتيح الصحيحة المستخرجة من حسابك بنجاح
    (function() {
        emailjs.init({
            publicKey: "-KryRcikMUDVyC3kQ", 
        });
    })();

    function checkUrlToken() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('reset_token');
        if (token) {
            try {
                const decodedEmail = atob(token);
                const userExists = users.find(u => u.email === decodedEmail);
                if (userExists) {
                    resetEmailTarget = decodedEmail;
                    switchAuthMode('reset');
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            } catch(e) { console.log("رابط غير صالح"); }
        }
    }

    function checkLoginStatus() {
        if (currentUser) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('current-user-email').innerText = currentUser;
            render();
        } else {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
            checkUrlToken(); 
            if (authMode !== 'reset') switchAuthMode('login');
        }
    }

    function switchAuthMode(mode) {
        const title = document.getElementById('auth-title');
        const btn = document.getElementById('btn-auth-action');
        const toggleText = document.getElementById('toggle-text');
        const emailGroup = document.getElementById('email-group');
        const passwordGroup = document.getElementById('password-group');
        const passwordLabel = document.getElementById('password-label');
        const passwordInput = document.getElementById('authPassword');
        const forgotLink = document.getElementById('forgot-link');

        authMode = mode;
        emailGroup.style.display = "block";
        passwordGroup.style.display = "block";
        forgotLink.style.display = "none";
        passwordInput.placeholder = "••••••••";

        if (authMode === 'register') {
            title.innerText = "إنشاء حساب جديد";
            btn.innerText = "تسجيل الحساب";
            passwordLabel.innerText = "كلمة السر";
            toggleText.innerHTML = `لديك حساب بالفعل؟ <span onclick="switchAuthMode('login')">سجل دخولك</span>`;
        } else if (authMode === 'forgot') {
            title.innerText = "استعادة آمنة لحسابك";
            btn.innerText = "إرسال رابط إعادة التعيين لإيميلي";
            passwordGroup.style.display = "none";
            toggleText.innerHTML = `تذكرت كلمة السر؟ <span onclick="switchAuthMode('login')">سجل دخولك</span>`;
        } else if (authMode === 'reset') {
            title.innerText = "تعيين كلمة سر جديدة";
            btn.innerText = "تحديث كلمة السر";
            emailGroup.style.display = "none";
            passwordLabel.innerText = "كلمة السر الجديدة لحساب: " + resetEmailTarget;
            passwordInput.placeholder = "اكتب كلمة السر الجديدة هنا";
            toggleText.innerHTML = `<span onclick="switchAuthMode('login')">إلغاء والعودة للدخول</span>`;
        } else {
            title.innerText = "تسجيل الدخول";
            btn.innerText = "دخول";
            passwordLabel.innerText = "كلمة السر";
            forgotLink.style.display = "block";
            toggleText.innerHTML = `ليس لديك حساب؟ <span onclick="switchAuthMode('register')">أنشئ حساباً جديداً</span>`;
        }
    }

    function handleAuth() {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value.trim();

        if (authMode === 'forgot') {
            if (!email) { alert("يرجى إدخال البريد الإلكتروني أولاً"); return; }
            
            const user = users.find(u => u.email === email);
            if (user) {
                const secureToken = btoa(user.email);
                const appUrl = window.location.href.split('?')[0];
                const finalResetLink = appUrl + "?reset_token=" + secureToken;
                
                const btn = document.getElementById('btn-auth-action');
                btn.innerText = "جاري الإرسال بأمان...";
                btn.disabled = true;

                const templateParams = {
                    email: user.email,
                    reset_link: finalResetLink
                };

                // استخدام معرف الخدمة ومعرف القالب الخاص بك لإرسال بريد الاستعادة
                emailjs.send(
                    'service_bjt0g0d', 
                    'template_70cxo8f', 
                    templateParams
                )
                .then(function(response) {
                    btn.innerText = "إرسال رابط إعادة التعيين لإيميلي";
                    btn.disabled = false;
                    alert("🔒 تم إرسال الرابط بنجاح وسرية تامة مباشرة إلى بريدك الإلكتروني.");
                    switchAuthMode('login');
                }, function(error) {
                    btn.innerText = "إرسال رابط إعادة التعيين لإيميلي";
                    btn.disabled = false;
                    alert("فشل الإرسال: " + JSON.stringify(error));
                });
            } else {
                alert("عذرًا، هذا البريد الإلكتروني غير مسجل.");
            }
            return;
        }

        if (authMode === 'reset') {
            if (!password || password.length < 4) { alert("يرجى إدخال كلمة سر صالحة (لا تقل عن 4 رموز)"); return; }
            
            users = users.map(u => {
                if (u.email === resetEmailTarget) { return { ...u, password: password }; }
                return u;
            });
            localStorage.setItem('wallet_users', JSON.stringify(users));
            alert("🎉 تم تغيير كلمة المرور بنجاح.");
            document.getElementById('authPassword').value = "";
            switchAuthMode('login');
            return;
        }

        if (!email || !password) { alert("يرجى ملء جميع الحقول"); return; }

        if (authMode === 'register') {
            const userExists = users.find(u => u.email === email);
            if (userExists) { alert("هذا البريد الإلكتروني مسجل بالفعل!"); return; }
            users.push({ email, password });
            localStorage.setItem('wallet_users', JSON.stringify(users));
            alert("تم إنشاء الحساب بنجاح!");
            switchAuthMode('login');
        } else {
            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                currentUser = email;
                localStorage.setItem('wallet_current_user', currentUser);
                checkLoginStatus();
            } else {
                alert("البريد الإلكتروني أو كلمة السر غير صحيحة");
            }
        }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('wallet_current_user');
        document.getElementById('authEmail').value = "";
        document.getElementById('authPassword').value = "";
        checkLoginStatus();
    }

    async function startCamera() {
        const container = document.getElementById('camera-container');
        const video = document.getElementById('video');
        container.style.display = 'block';
        document.getElementById('start-cam').style.display = 'none';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            video.srcObject = stream;
        } catch (err) { alert("خطأ في الكاميرا: " + err); }
    }

    function takeSnapshot() {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        currentImgData = canvas.toDataURL('image/jpeg', 0.5); 
        video.srcObject.getTracks().forEach(track => track.stop());
        document.getElementById('camera-container').style.display = 'none';
        document.getElementById('start-cam').style.display = 'block';
        document.getElementById('start-cam').innerText = "🔄 إعادة التصوير";
    }

    function saveDocument() {
        const name = document.getElementById('docName').value;
        const date = document.getElementById('docDate').value;
        
        if (name && date) {
            allDocuments.push({ name, date, image: currentImgData, id: Date.now(), userEmail: currentUser });
            localStorage.setItem('hicham_docs_pro', JSON.stringify(allDocuments));
            
            document.getElementById('docName').value = "";
            document.getElementById('docDate').value = "";
            currentImgData = "";
            document.getElementById('start-cam').innerText = "📸 تصوير وثيقة جديدة (اختياري)";
            render();
        } else { alert("يرجى إدخال اسم الوثيقة وتاريخ الانتهاء أولاً"); }
    }

    function deleteDoc(id) {
        if(confirm("هل أنت متأكد من حذف الوثيقة؟")) {
            allDocuments = allDocuments.filter(d => d.id !== id);
            localStorage.setItem('hicham_docs_pro', JSON.stringify(allDocuments));
            render();
        }
    }

    function getAlertStyle(expiryDate) {
        const diffDays = Math.ceil((new Date(expiryDate) - new Date()) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return { text: "⚠️ منتهية الصلاحية", class: "badge-red urgent-alert", color: "#f87171" };
        if (diffDays <= 7) return { text: `🚨 تنبيه حرج: ${diffDays} يوم`, class: "badge-red urgent-alert", color: "#f87171" };
        if (diffDays <= 30) return { text: `📅 اقترب الموعد: ${diffDays} يوم`, class: "badge-orange", color: "#fbbf24" };
        return { text: `✅ صالحة: ${diffDays} يوم`, class: "badge-green", color: "#34d399" };
    }

    function render() {
        const list = document.getElementById('docList');
        let userDocs = allDocuments.filter(doc => doc.userEmail === currentUser);
        
        userDocs.sort((a, b) => new Date(a.date) - new Date(b.date));
        list.innerHTML = userDocs.map(doc => {
            const alert = getAlertStyle(doc.date);
            
            const mediaPreview = doc.image 
                ? `<img src="${doc.image}" class="doc-img-preview">` 
                : `<div class="no-img-preview">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                     &nbsp; وثيقة نصية بدون صورة
                   </div>`;

            return `
                <div class="doc-item" style="border-right: 6px solid ${alert.color}">
                    ${mediaPreview}
                    <div class="doc-content">
                        <div class="doc-info">
                            <b>${doc.name}</b>
                            <small>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                ${doc.date}
                            </small>
                            <span class="status-tag ${alert.class}">${alert.text}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteDoc(${doc.id})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    checkLoginStatus();
</script>

</body>
</html>
